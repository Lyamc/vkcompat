[package]
name = "vkcompat"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Partial Vulkan 1.0 ICD. Windows probes DirectX 11, DirectX 9, then OpenGL. Linux and macOS expose OpenGL and a CPU rasterizer."
publish = false

[lib]
name = "vkcompat"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "vkcompat_test"
path = "src/bin/vkcompat_test.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }
